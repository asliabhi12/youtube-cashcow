label: Chitralekhanam
description: No creative modifications — runs the base pipeline as-is.
resize:
  preset: youtube
  zoom: 1.18
  padding: false
audio:
  effects:
  - type: volume
    gain: 13.0
  - type: bass
    gain: 1.5
color:
  brightness: 0.03
  contrast: 1.26
  saturation: 1.16
  gamma: 1.05
  hue: -5.0
  temperature: 0.06
  tint: 0.05
  vibrance: 0.04
overlay:
  asset: over.jpg
  x: center
  y: center
  scale: 1.1
  opacity: 1.0
  rotation: 0.0
  layer: 0
  mask:
    type: ellipse
    feather: 72.0
    rotation: 0.0
    invert: true
metadata_prompt: Write a clear, searchable YouTube title and description with clean
  SEO, natural language, and accurate tags.
allowed_destination_ids: []
